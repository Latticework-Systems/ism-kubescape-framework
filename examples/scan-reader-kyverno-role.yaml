# Optional companion to scan-reader-rbac.yaml.
#
# Grants the scan identity get access to the approved-registry ConfigMap.
# latticework_ism_scan.sh applies this Role when the Kyverno namespace exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ism-scan-reader
  namespace: kyverno
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - ism-approved-registries
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ism-scan-reader
  namespace: kyverno
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ism-scan-reader
subjects:
  - kind: ServiceAccount
    name: ism-scan-reader
    namespace: ism-scan
