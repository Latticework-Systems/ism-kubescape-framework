apiVersion: v1
kind: Namespace
metadata:
  name: ism-scan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ism-scan-reader
  namespace: ism-scan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ism-scan-reader
rules:
  # The ClusterRole omits ConfigMaps. The namespaced Role in
  # scan-reader-kyverno-role.yaml grants get access to one registry ConfigMap.
  # A cluster-wide ConfigMap read would expose application configuration.
  - apiGroups: [""]
    resources:
      - namespaces
      - serviceaccounts
      - pods
      - nodes
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ism-scan-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ism-scan-reader
subjects:
  - kind: ServiceAccount
    name: ism-scan-reader
    namespace: ism-scan
